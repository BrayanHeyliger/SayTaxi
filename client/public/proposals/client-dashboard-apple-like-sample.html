<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Dashboard - Apple Like Sample</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: rgba(255, 255, 255, 0.78);
      --line: rgba(15, 23, 42, 0.08);
      --text: #0f172a;
      --muted: #52607a;
      --accent: #0ea5a4;
      --accent-2: #2563eb;
      --danger: #dc2626;
      --shadow-soft: 0 20px 45px rgba(15, 23, 42, 0.12);
      --shadow-card: 0 8px 22px rgba(15, 23, 42, 0.08);
      --radius-xl: 24px;
      --radius-lg: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "SF Pro Text", "Avenir Next", "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 12%, rgba(56, 189, 248, 0.22), transparent 34%),
        radial-gradient(circle at 86% 10%, rgba(16, 185, 129, 0.20), transparent 38%),
        linear-gradient(160deg, #f8fbff 0%, #eef2ff 38%, #f8fafc 100%);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      border: 1px solid rgba(15, 23, 42, 0.10);
      background: var(--bg);
      box-shadow: 0 30px 60px rgba(15, 23, 42, 0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      padding: 18px 18px 14px;
      background: linear-gradient(160deg, rgba(255,255,255,0.9), rgba(255,255,255,0.75));
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 3;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(145deg, #111827, #334155);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 20px;
      position: relative;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #22c55e;
      position: absolute;
      right: -3px;
      bottom: -3px;
      border: 2px solid #fff;
    }

    .title {
      margin: 0;
      font-size: 36px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 650;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: #1e293b;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .kpis {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .kpi {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 9px 10px;
      background: rgba(255,255,255,0.75);
    }

    .kpi label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.17em;
      margin-bottom: 4px;
    }

    .kpi strong {
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(10px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      border-radius: 12px;
      border: 1px solid transparent;
      padding: 8px 10px;
      font-size: 13px;
      color: #64748b;
      background: transparent;
    }

    .tab.active {
      color: #0f172a;
      border-color: rgba(37, 99, 235, 0.2);
      background: rgba(37, 99, 235, 0.10);
    }

    .content {
      flex: 1;
      overflow: auto;
      padding: 14px;
      padding-bottom: 172px;
    }

    .hero-card {
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, #0b1025, #1f2a44);
      padding: 16px;
      color: #fff;
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }

    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin: 0 0 8px;
    }

    .hero-title {
      margin: 0;
      font-size: 33px;
      line-height: 1;
      letter-spacing: -0.03em;
      font-weight: 680;
    }

    .hero-copy {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.72);
      font-size: 14px;
    }

    .map-card {
      border-radius: var(--radius-xl);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .map-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }

    .map-title {
      margin: 0;
      font-size: 36px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 650;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,0.12);
      background: rgba(255,255,255,0.85);
      color: #334155;
      font-size: 12px;
      padding: 5px 10px;
      font-weight: 600;
    }

    .map {
      height: 330px;
      background:
        linear-gradient(135deg, rgba(148, 163, 184, 0.18), rgba(148, 163, 184, 0.04)),
        repeating-linear-gradient(60deg, rgba(100, 116, 139, 0.09) 0px, rgba(100, 116, 139, 0.09) 8px, transparent 8px, transparent 24px),
        #e9edf4;
      position: relative;
    }

    .map-badge {
      position: absolute;
      left: 12px;
      bottom: 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.76);
      color: #fff;
      padding: 8px 10px;
      font-size: 12px;
      backdrop-filter: blur(7px);
    }

    .dock {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px 12px;
      border-top: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(7, 12, 31, 0.96), rgba(2, 6, 23, 0.98));
      backdrop-filter: blur(12px);
      box-shadow: 0 -20px 40px rgba(15,23,42,0.25);
    }

    .trip-mini {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(15,23,42,0.72);
      color: #fff;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      gap: 12px;
    }

    .trip-mini p {
      margin: 0;
      font-size: 11px;
      color: rgba(255,255,255,0.62);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .trip-mini strong {
      display: block;
      margin-top: 4px;
      font-size: 17px;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .trip-mini .eta {
      text-align: right;
      color: #2dd4bf;
      font-size: 14px;
      font-weight: 700;
    }

    .dock-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .act {
      border: none;
      border-radius: 16px;
      padding: 12px 8px;
      color: #fff;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: default;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .act.gps { background: linear-gradient(140deg, #1d4ed8, #2563eb); }
    .act.chat { background: linear-gradient(140deg, #059669, #10b981); }
    .act.sos  { background: #fff5f5; color: #dc2626; border: 1px solid #fecaca; }

    @media (max-width: 420px) {
      body { padding: 0; }
      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
      .hero-title, .map-title { font-size: 31px; }
    }
  </style>
</head>
<body>
  <article class="phone">
    <header class="header">
      <div class="top-row">
        <div class="identity">
          <div class="avatar">L<span class="status-dot"></span></div>
          <div>
            <h1 class="title">Lucia</h1>
            <p class="sub">Panel de Cliente</p>
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn">🔔</button>
          <button class="icon-btn">⚙</button>
          <button class="icon-btn">↗</button>
        </div>
      </div>
      <div class="kpis">
        <article class="kpi"><label>Estado</label><strong>En ruta</strong></article>
        <article class="kpi"><label>Nivel</label><strong>Gold</strong></article>
        <article class="kpi"><label>Puntos</label><strong>1,240</strong></article>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active">Viaje</button>
      <button class="tab">Paquetes</button>
      <button class="tab">Historial</button>
      <button class="tab">Promos</button>
      <button class="tab">Perfil</button>
    </nav>

    <section class="content">
      <article class="hero-card">
        <p class="hero-eyebrow">Passenger Premium</p>
        <h2 class="hero-title">Conductor en camino</h2>
        <p class="hero-copy">Seguimiento en vivo con experiencia limpia y control total.</p>
      </article>

      <article class="map-card">
        <div class="map-head">
          <h3 class="map-title">Mapa</h3>
          <span class="chip">ETA 4 min</span>
        </div>
        <div class="map">
          <div class="map-badge">Ruta: Brickell Ave 1201 → Miami Intl D</div>
        </div>
      </article>
    </section>

    <footer class="dock">
      <div class="trip-mini">
        <div>
          <p>En ruta a recogida</p>
          <strong>Brickell Ave 1201 → Miami Intl...</strong>
        </div>
        <div class="eta">4 min</div>
      </div>
      <div class="dock-actions">
        <button class="act gps">GPS</button>
        <button class="act chat">Chat</button>
        <button class="act sos">SOS</button>
      </div>
    </footer>
  </article>
</body>
</html>
