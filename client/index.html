<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Passenger</title>
    <meta name="description" content="Passenger — Tu viaje, tu elección." />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Passenger" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Theme color -->
    <meta name="theme-color" content="#111827" />
    <meta name="msapplication-TileColor" content="#111827" />
    <!-- Leaflet CSS (nativo, sin dependencia de Google Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Fuentes locales por defecto: no dependemos de Manus ni de Google Fonts -->
    <style>
      :root {
        --font-heading: "Segoe UI", "Inter", "Arial", sans-serif;
        --font-body: "Segoe UI", "Inter", "Arial", sans-serif;
      }
      html, body {
        font-family: var(--font-body);
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(regs => Promise.all(regs.map(reg => reg.unregister())))
          .catch(() => {});

        if ('caches' in window) {
          caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {});
        }

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=4')
            .then(reg => console.log('[PWA] Service Worker registrado:', reg.scope))
            .catch(err => console.warn('[PWA] SW error:', err));
        });
      }
    </script>
    <script>
      const analyticsEndpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const analyticsWebsiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;

      if (analyticsEndpoint && analyticsWebsiteId) {
        const script = document.createElement('script');
        script.defer = true;
        script.src = `${analyticsEndpoint.replace(/\/$/, '')}/umami`;
        script.dataset.websiteId = analyticsWebsiteId;
        document.head.appendChild(script);
      }
    </script>
  </body>

</html>
