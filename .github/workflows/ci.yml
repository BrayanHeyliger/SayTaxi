name: Validación de SayTaxi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saytaxi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias bloqueadas
        run: pnpm install --frozen-lockfile

      - name: Comprobar formato del parche
        run: git diff --check HEAD^ HEAD || true

      - name: Comprobar tipos
        run: pnpm check

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Compilar entrega de producción
        run: pnpm build
