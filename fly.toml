# El nombre se define automáticamente con `fly launch` o con `fly deploy -a <app>`.
# Mantener una instancia inicial evita dividir salas de Socket.IO antes de habilitar
# Redis y el adapter de producción en una segunda instancia.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[deploy]
  release_command = "node_modules/.bin/drizzle-kit migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
